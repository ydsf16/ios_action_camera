[package]
name = "roamshot-gyroflow"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "roamshot_gyroflow"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
gyroflow-core = { path = "../vendor/gyroflow/src/core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"

[profile.release]
opt-level = 3
